<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" role="img" aria-labelledby="title desc">
  <title id="title">The testing pyramid mapped onto the loop stack</title>
  <desc id="desc">A trapezoid pyramid with three layers (unit at the bottom, integration in the middle, e2e at the top). Each layer is annotated on the right with the loop it runs in: local tests for unit, CI for integration, QA / staging for e2e. Below the pyramid, a thin strip represents the editor and compile loops that catch the free stuff.</desc>

  <defs>
    <style>
      .loop        { fill: #1f2937; font-size: 14px; font-weight: 600; }
      .loop-sub    { fill: #4b5563; font-size: 12px; font-weight: 400; }
      .layer-label { fill: #0f172a; font-size: 16px; font-weight: 700; }
      .layer-sub   { fill: #334155; font-size: 12px; font-weight: 400; font-style: italic; }
      .count       { fill: #6b7280; font-size: 11px; font-weight: 400; }
      .stroke      { fill: none; stroke: #0f172a; stroke-width: 1.5; }
      .stroke-thin { fill: none; stroke: #6b7280; stroke-width: 1; stroke-dasharray: 3 3; }
      .title       { fill: #0f172a; font-size: 18px; font-weight: 700; }
      .subtitle    { fill: #475569; font-size: 12px; font-weight: 400; }
      .tick        { fill: #475569; font-size: 11px; }
    </style>
  </defs>

  <!-- Title -->
  <text x="460" y="28" text-anchor="middle" class="title">the testing pyramid, by loop</text>
  <text x="460" y="48" text-anchor="middle" class="subtitle">each layer runs in a different loop of the loop stack</text>

  <!-- =============== E2E LAYER (top, narrow) =============== -->
  <polygon points="310,90 610,90 700,230 220,230" class="stroke" fill="#fef3c7"/>
  <text x="460" y="135" text-anchor="middle" class="layer-label">e2e</text>
  <text x="460" y="155" text-anchor="middle" class="layer-sub">the user clicking buttons you</text>
  <text x="460" y="172" text-anchor="middle" class="layer-sub">never imagined they'd click</text>

  <!-- right-side annotation: QA / staging -->
  <line x1="700" y1="160" x2="780" y2="160" class="stroke-thin"/>
  <circle cx="700" cy="160" r="2.5" fill="#0f172a"/>
  <text x="790" y="156" class="loop">QA / staging</text>
  <text x="790" y="173" class="loop-sub">hours → days</text>
  <text x="790" y="190" class="count">a few of these</text>

  <!-- =============== INTEGRATION LAYER (middle) =============== -->
  <polygon points="220,230 700,230 800,390 120,390" class="stroke" fill="#dbeafe"/>
  <text x="460" y="285" text-anchor="middle" class="layer-label">integration</text>
  <text x="460" y="305" text-anchor="middle" class="layer-sub">mocks for the externals,</text>
  <text x="460" y="322" text-anchor="middle" class="layer-sub">real for your own services</text>

  <line x1="800" y1="310" x2="870" y2="310" class="stroke-thin"/>
  <circle cx="800" cy="310" r="2.5" fill="#0f172a"/>
  <text x="880" y="306" class="loop">CI</text>
  <text x="880" y="323" class="loop-sub">minutes</text>
  <text x="880" y="340" class="count">some of these</text>

  <!-- =============== UNIT LAYER (bottom, widest) =============== -->
  <polygon points="120,390 800,390 880,540 40,540" class="stroke" fill="#dcfce7"/>
  <text x="460" y="440" text-anchor="middle" class="layer-label">unit</text>
  <text x="460" y="460" text-anchor="middle" class="layer-sub">the function you broke</text>
  <text x="460" y="477" text-anchor="middle" class="layer-sub">"just refactoring a little"</text>

  <line x1="880" y1="465" x2="940" y2="465" class="stroke-thin"/>
  <text x="950" y="461" class="loop">Local tests</text>
  <text x="950" y="478" class="loop-sub">seconds → minutes</text>
  <text x="950" y="495" class="count">most of your tests</text>

  <!-- =============== EDITOR / COMPILE STRIP (under pyramid) =============== -->
  <polygon points="40,540 880,540 920,600 0,600" class="stroke" fill="#f3f4f6"/>
  <text x="460" y="572" text-anchor="middle" class="layer-label">lint · types · compile asserts</text>
  <text x="460" y="590" text-anchor="middle" class="layer-sub">"the free stuff"</text>

  <line x1="920" y1="570" x2="980" y2="570" class="stroke-thin"/>
  <text x="990" y="566" class="loop">Editor / Compile</text>
  <text x="990" y="583" class="loop-sub">~100ms → seconds</text>

  <!-- =============== LEFT-SIDE TIME AXIS =============== -->
  <line x1="50" y1="90" x2="50" y2="600" class="stroke"/>
  <!-- arrowhead -->
  <polygon points="50,90 45,100 55,100" fill="#0f172a"/>
  <text x="20" y="95" text-anchor="middle" class="tick">fast</text>
  <text x="20" y="595" text-anchor="middle" class="tick">slow</text>
  <text x="20" y="345" text-anchor="middle" transform="rotate(-90 20 345)" class="tick">loop latency →</text>

  <!-- =============== BOTTOM CAPTION =============== -->
  <text x="460" y="640" text-anchor="middle" class="loop-sub">a unit test that takes 8 minutes is a CI test in disguise.</text>
  <text x="460" y="658" text-anchor="middle" class="loop-sub">an integration test that needs real Postgres + Kafka + VPN is a QA test in disguise.</text>
  <text x="460" y="676" text-anchor="middle" class="loop-sub">an e2e test that only runs on the deploy bot's laptop at 3am is a production test in disguise.</text>
</svg>